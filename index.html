    <!-- Primary SEO -->

    <!-- Structured data: organization identity + sitelinks search box -->

      {
        "@context": "https://schema.org",

      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Social Dev Technologies",
        "url": "https://socialdevtechnologies.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://socialdevtechnologies.com/catalog?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
