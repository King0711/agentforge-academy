<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BC4F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2A7EC8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A4E8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="braceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8DCFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BC4F5;stop-opacity:1" />
    </linearGradient>
    <clipPath id="headClip">
      <path d="
        M 100 20
        C 60 20, 35 50, 35 85
        C 35 108, 45 128, 62 140
        L 62 155
        C 62 162, 68 165, 75 163
        L 85 160
        C 90 162, 95 163, 100 163
        C 140 163, 165 128, 165 85
        C 165 50, 140 20, 100 20 Z
      "/>
    </clipPath>
  </defs>

  <!-- Head shape -->
  <path d="
    M 105 18
    C 65 18, 38 48, 38 83
    C 38 106, 48 126, 66 138
    L 66 155
    C 66 164, 74 167, 80 165
    L 92 161
    C 96 162, 100 163, 105 163
    C 148 163, 172 128, 172 83
    C 172 48, 145 18, 105 18 Z
  " fill="url(#headGrad)" />

  <!-- Darker shading layer on right side of head -->
  <path d="
    M 130 22
    C 155 35, 172 58, 172 83
    C 172 128, 148 163, 105 163
    C 108 163, 111 162, 114 162
    C 150 158, 175 125, 175 83
    C 175 57, 162 35, 140 22 Z
  " fill="#1A4E8A" opacity="0.5"/>

  <!-- Neck -->
  <rect x="80" y="155" width="26" height="18" rx="4" fill="url(#headGrad)" />

  <!-- Curly braces { } -->
  <!-- Left brace { -->
  <text x="42" y="110" font-family="Georgia, serif" font-size="72" font-weight="bold"
        fill="url(#braceGrad)" opacity="0.9">{</text>

  <!-- Right brace } -->
  <text x="110" y="110" font-family="Georgia, serif" font-size="72" font-weight="bold"
        fill="url(#braceGrad)" opacity="0.9">}</text>

  <!-- Eye -->
  <ellipse cx="130" cy="78" rx="7" ry="8" fill="#0A2A4A" />
  <ellipse cx="132" cy="76" rx="2.5" ry="2.5" fill="white" opacity="0.6" />
</svg>
